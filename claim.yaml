extra_gaps:
  - title: "A preprint reports that the Lean statements and the written proof differ in at least one lemma"
    spoken: >-
      Bastounis, Circelli and Hansen report that the Lean estimate standing in for the paper's Lemma 8.6 bounds the
      inverse with one more derivative than the paper's inequality, and that similar mismatches occur elsewhere, so a
      clean Lean check does not by itself confirm the written proof. They make no claim that the result fails. Whether
      the formal development carries the paper's argument, or a different one that reaches the same statement, is a
      reading.
    what: "an analyst reads Lemma 8.6 and the other mismatches the preprint lists against the Lean files and signs or refuses that each is immaterial to the formal result"
    who: "an analyst who reads Lean, a few hours with the preprint's list"
    kind: read
    ask: "A reading of the preprint's listed mismatches against the Lean development, signed or refused one by one."
    expected_signal: "a read cycle listing each mismatch as immaterial, material or unresolved"
