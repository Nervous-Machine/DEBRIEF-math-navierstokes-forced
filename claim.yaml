# Claim file for DEBRIEF/tools/new_mission.py. Plain words throughout; nothing here calls the claim proved, verified or a theorem.
name: navierstokes-forced
label: "Navier–Stokes blow-up, forced (OpenAI)"
title: "The claimed finite-time blow-up of the three-dimensional Navier–Stokes equations with a smooth force, announced by OpenAI on 8 September 2026 with a Lean development"
area: "Partial differential equations: regularity of the Navier–Stokes equations"
rests_on: "a 166-page paper, a Lean 4 development with Comparator challenge files, and a metadata file recording the review status as self-assessed"
short_version: >-
  On 8 September 2026 OpenAI announced that an internal model had constructed, for every positive viscosity, a smooth
  force compactly supported in space and time and a solution of the three-dimensional Navier–Stokes equations starting
  from rest whose velocity becomes unbounded in finite time while its kinetic energy stays bounded, on space and on the
  torus. In the Clay formulation this is alternatives (C) and (D), which allow a force; alternatives (A) and (B), the
  unforced existence question, are untouched, and the day before the announcement Tristan Buckmaster had posted that he
  and Levent Alpöge had forced blow-up for the Euler equations by the same program, which they credit to Córdoba and
  Martínez-Zoroa. A Lean development accompanies the paper. A third party reports building it in October: no sorry,
  the three standard axioms, and statements identical to DeepMind's formal-conjectures file, which has since marked (C)
  and (D) as solved. A preprint by Bastounis, Circelli and Hansen reports that one lemma's Lean translation is weaker
  than the paper's statement, without claiming the result fails. No referee report exists. In November Alpöge and
  Buckmaster claimed the unforced case, recorded separately.
announcement_plain: "The claim was announced on OpenAI's blog and at a press briefing, with the paper on OpenAI's own servers and the Lean development on GitHub."
problem:
  name: "Navier–Stokes existence and smoothness"
  url: https://www.claymath.org/millennium/navier-stokes-equation/
  posed: "one of the seven Clay Millennium Prize Problems (2000), formulated by Charles Fefferman as four alternatives: existence and smoothness on space (A) and on the torus (B), or breakdown on space (C) and on the torus (D)"
  plain: >-
    Do smooth solutions of the three-dimensional incompressible Navier–Stokes equations, started from smooth data, stay
    smooth for all time, or can the velocity become unbounded in finite time? Fefferman's formulation accepts either
    answer: a proof of existence and smoothness, with no force on space (A) or on the torus (B), or a proof of
    breakdown, which may use a smooth force, on space (C) or on the torus (D). This claim is (C) and (D) with a force.
    A third-party Lean formalization of all four alternatives exists in DeepMind's formal-conjectures, and the
    development's Comparator files take their reference statements from it.
  formal_statement: {repo: google-deepmind/formal-conjectures, path: FormalConjectures/Millennium/NavierStokes.lean, commit: 2207c54d0dbe960de591d280f997b195bf3f6e28, blob_sha: c21ccbfb73a85a930970d3b93ad23bd4c97d082a, size: 14574, symbol: navier_stokes_breakdown_R3}
claims:
  - by: "OpenAI"
    ai: "GPT-6 Astra agents in the Codex framework, as listed in the repository's formalization.yaml; the paper's author line reads OpenAI"
    submitted: "2026-09-08"
    where: https://openai.com/index/navier-stokes-solution/
    summary_plain: >-
      The paper's main result says that for every positive viscosity there are a smooth force with compact support in
      space and time, a compact set, and smooth velocity and pressure fields on space, starting from zero velocity,
      supported in that set, with bounded kinetic energy, whose velocity becomes unbounded as time approaches one; and
      so no smooth solution with that force and datum exists for all time with bounded energy. Compact support carries
      the construction to the torus. The paper names these as alternatives (C) and (D) of Fefferman's formulation. A
      companion paper claims unforced blow-up for the Euler equations.
    notes_plain: >-
      The repository's metadata file records four main results with zero sorry and the three standard axioms, lists
      GPT-6 Astra in the Codex framework as the method, and records the review status as self-assessed. The press
      reported experts who regard the force as a loophole in the problem's wording and others who called the result a
      surprise if it holds. Buckmaster's statement of 7 September alleges that OpenAI adopted his and Alpöge's method
      after learning of their progress, which OpenAI denies; the statement says the pair's own forced results were
      checked in Lean on 22 August.
